<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="25%" cy="20%" r="95%">
      <stop offset="0" stop-color="#fcecc0"/>
      <stop offset="0.55" stop-color="#f4cd5e"/>
      <stop offset="1" stop-color="#edb92f"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>

    <!-- cat silhouette: body, ears, head -->
    <g id="shp">
      <ellipse cx="0" cy="78" rx="60" ry="62"/>
      <polygon points="-54,-14 -50,-76 -10,-46"/>
      <polygon points="54,-14 50,-76 10,-46"/>
      <ellipse cx="0" cy="0" rx="60" ry="50"/>
    </g>
    <g id="innerEars">
      <polygon points="-46,-26 -44,-60 -22,-42" fill="#e9a0a8"/>
      <polygon points="46,-26 44,-60 22,-42" fill="#e9a0a8"/>
    </g>
    <g id="eyes">
      <ellipse cx="-24" cy="-4" rx="9.5" ry="10.5" fill="currentColor"/>
      <ellipse cx="24" cy="-4" rx="9.5" ry="10.5" fill="currentColor"/>
      <ellipse cx="-24" cy="-4" rx="3.6" ry="8.5" fill="#1b1210"/>
      <ellipse cx="24" cy="-4" rx="3.6" ry="8.5" fill="#1b1210"/>
      <circle cx="-21" cy="-8" r="2.3" fill="#fff"/>
      <circle cx="27" cy="-8" r="2.3" fill="#fff"/>
    </g>
    <g id="nose">
      <polygon points="-6.5,11 6.5,11 0,18" fill="#e58c97"/>
      <path d="M0 18 v5 M0 23 q-7 7 -14 1 M0 23 q7 7 14 1" stroke="#2f2118" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- front legs + paws -->
    <g id="paws">
      <path d="M0 106 v28" stroke="#2f2118" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <ellipse cx="-23" cy="128" rx="19" ry="15" fill="currentColor" stroke="#2f2118" stroke-width="4.5"/>
      <ellipse cx="23" cy="128" rx="19" ry="15" fill="currentColor" stroke="#2f2118" stroke-width="4.5"/>
      <path d="M-29 129 v8 M-18 129 v8 M18 129 v8 M29 129 v8" stroke="#2f2118" stroke-width="2.4" stroke-linecap="round" opacity=".65"/>
    </g>

    <!-- tail (curls up on the right; mirrored for the left side) -->
    <g id="tail">
      <path d="M38 124 C104 134 118 76 88 40" fill="none" stroke="#2f2118" stroke-width="25" stroke-linecap="round"/>
      <path d="M38 124 C104 134 118 76 88 40" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sun glow -->
    <circle cx="410" cy="92" r="46" fill="#fff3c9" opacity="0.55"/>
    <!-- grass -->
    <path d="M0 405 Q130 362 256 388 T512 382 V512 H0Z" fill="#6fae3e"/>
    <path d="M0 450 Q150 415 290 440 T512 430 V512 H0Z" fill="#58963a"/>

    <!-- BACK ROW -->
    <!-- tortoiseshell (tail curls left) -->
    <g transform="translate(112 206) scale(.9)">
      <g transform="scale(-1 1)">
        <use href="#tail" color="#2c2224"/>
        <path d="M112 90 C118 70 106 52 88 40" fill="none" stroke="#dc7a2c" stroke-width="16" stroke-linecap="round"/>
      </g>
      <use href="#shp" fill="#2f2118" stroke="#2f2118" stroke-width="9" stroke-linejoin="round"/>
      <use href="#shp" fill="currentColor" color="#2c2224"/>
      <ellipse cx="-30" cy="-22" rx="17" ry="12" fill="#dc7a2c" transform="rotate(-25 -30 -22)"/>
      <ellipse cx="34" cy="-30" rx="9" ry="8" fill="#dc7a2c"/>
      <ellipse cx="-26" cy="90" rx="18" ry="22" fill="#dc7a2c" opacity=".9"/>
      <use href="#paws" color="#2c2224"/>
      <use href="#innerEars"/>
      <use href="#eyes" color="#f2b92e"/>
      <use href="#nose"/>
    </g>
    <!-- black (tail curls right) -->
    <g transform="translate(400 206) scale(.9)">
      <use href="#tail" color="#26262d"/>
      <use href="#shp" fill="#2f2118" stroke="#2f2118" stroke-width="9" stroke-linejoin="round"/>
      <use href="#shp" fill="currentColor" color="#26262d"/>
      <use href="#paws" color="#26262d"/>
      <polygon points="-46,-26 -44,-60 -22,-42" fill="#7d4f5e"/>
      <polygon points="46,-26 44,-60 22,-42" fill="#7d4f5e"/>
      <use href="#eyes" color="#f4c531"/>
      <use href="#nose"/>
    </g>
    <!-- siamese (tail curls right) -->
    <g transform="translate(256 172)">
      <use href="#tail" color="#6e4f40"/>
      <use href="#shp" fill="#2f2118" stroke="#2f2118" stroke-width="9" stroke-linejoin="round"/>
      <use href="#shp" fill="currentColor" color="#f0e1c8"/>
      <use href="#paws" color="#8a6a56"/>
      <polygon points="-52,-18 -49,-68 -17,-44" fill="#6e4f40"/>
      <polygon points="52,-18 49,-68 17,-44" fill="#6e4f40"/>
      <ellipse cx="0" cy="16" rx="27" ry="21" fill="#8a6a56" opacity=".85"/>
      <use href="#eyes" color="#5aa9e8"/>
      <use href="#nose"/>
    </g>

    <!-- FRONT ROW -->
    <!-- orange tabby (tail curls left) -->
    <g transform="translate(160 330)">
      <g transform="scale(-1 1)">
        <use href="#tail" color="#f3922d"/>
        <path d="M110 108 l-15 9 M117 88 l-16 5 M114 66 l-14 0" stroke="#c9641a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      </g>
      <use href="#shp" fill="#2f2118" stroke="#2f2118" stroke-width="9" stroke-linejoin="round"/>
      <use href="#shp" fill="currentColor" color="#f3922d"/>
      <use href="#paws" color="#f3922d"/>
      <use href="#innerEars"/>
      <path d="M-9 -48 v14 M0 -50 v17 M9 -48 v14" stroke="#c9641a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-50 70 h16 M-52 88 h16 M34 70 h16 M36 88 h16" stroke="#c9641a" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="-15" cy="23" rx="19" ry="14" fill="#fff3df"/>
      <ellipse cx="15" cy="23" rx="19" ry="14" fill="#fff3df"/>
      <path d="M-34 -2 q10 -12 20 0 M14 -2 q10 -12 20 0" stroke="#2f2118" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <use href="#nose"/>
    </g>
    <!-- grey & white (tail curls right) -->
    <g transform="translate(350 336)">
      <use href="#tail" color="#808896"/>
      <use href="#shp" fill="#2f2118" stroke="#2f2118" stroke-width="9" stroke-linejoin="round"/>
      <use href="#shp" fill="currentColor" color="#808896"/>
      <ellipse cx="0" cy="92" rx="30" ry="38" fill="#f8f4eb"/>
      <use href="#paws" color="#f8f4eb"/>
      <polygon points="-9,-46 9,-46 13,2 -13,2" fill="#f8f4eb"/>
      <use href="#innerEars"/>
      <ellipse cx="0" cy="24" rx="31" ry="23" fill="#f8f4eb"/>
      <use href="#eyes" color="#c8d04a"/>
      <use href="#nose"/>
    </g>
  </g>
</svg>
